spring.application.name=academia
app.version=1.0.0

server.port=8080
server.servlet.context-path=/backend

# Banco PostgreSQL (sobe com o docker-compose.yml, porta 5433 pra nao brigar com um Postgres local)
spring.datasource.url=jdbc:postgresql://localhost:5433/academia
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger: http://localhost:8080/backend/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
