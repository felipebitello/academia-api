name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: academia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compilar
        run: ./mvnw -B package

      - name: Subir a API e testar os endpoints
        run: |
          set -o pipefail
          java -jar target/academia-1.0.0.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://localhost:8080/backend/v3/api-docs > /dev/null && break
            sleep 2
          done
          bash .github/scripts/smoke-test.sh 2>&1 | tee smoke.log
          curl -s http://localhost:8080/backend/v3/api-docs > openapi.json

      - name: Log da aplicação
        if: always()
        run: tail -n 150 app.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado
          path: |
            openapi.json
            app.log
            smoke.log
